name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDFLARE_ACCOUNT_ID: 6495d15c9d09b19ddc65f0a01892a183

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @app/web build

  # Pull requests: a full dev environment of its own (docs/previews.md): its own
  # D1 database, queue and four Workers. preview-cleanup.yml deletes it on close.
  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency: preview-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_AUTH_SECRET: ${{ secrets.PREVIEW_AUTH_SECRET }}
      PREVIEW_EXPORT_KEY: ${{ secrets.PREVIEW_EXPORT_KEY }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update the environment
        id: up
        run: |
          scripts/preview.sh up "$PR" | tee preview.log
          echo "url=$(tail -n 1 preview.log)" >> "$GITHUB_OUTPUT"
      - name: Comment the link
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.up.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "**Dev environment:** $URL

          Updated for $SHA. It has its own empty database: sign up to try it. Emails, including sign-in links, are written to the \`event-web-pr-$PR\` Worker's logs. It's deleted when this pull request closes."

  # main: migrate, then deploy in dependency order (the coordinator defines the
  # Durable Object class the others bind to).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy coordinator
        working-directory: apps/coordinator
        run: pnpm exec wrangler deploy
      - name: Deploy jobs
        working-directory: apps/jobs
        run: pnpm exec wrangler deploy
      - name: Deploy api
        working-directory: apps/api
        run: pnpm exec wrangler deploy
      - name: Build and deploy web
        working-directory: apps/web
        run: pnpm build && pnpm exec wrangler deploy
      - name: Smoke test
        run: curl --fail --retry 3 --retry-delay 5 https://event-web.zias.workers.dev/health
